version: "3.7"
services:

  redis:
    container_name: redis
    image: redis:alpine

  backend:
    image: rvksoft/strava_templates_backend
    container_name: strava_templates_backend
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always

  web:
    image: rvksoft/strava_templates_web:latest
    container_name: strava_templates_web
    ports:
      - "3000:80"

  celery:
    container_name: celery
    image: rvksoft/strava_templates_celery:latest
    env_file: .env
    restart: always
    command: >
      sh -c "sleep 10 && celery -A strava_views worker --loglevel=info"
    depends_on:
      - redis
    links:
      - redis
